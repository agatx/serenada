<!doctype html>
<meta charset="utf-8">
<title>Opus RED mixed-fleet interop</title>
<pre id="result">RUNNING</pre>
<script type="module">
const resultElement = document.querySelector('#result');

const timeout = (promise, ms, label) => Promise.race([
  promise,
  new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} timed out`)), ms)),
]);

function audioCodecs() {
  return RTCRtpSender.getCapabilities('audio')?.codecs ?? [];
}

// `old-default` models the SDK before enableOpusRed: it leaves runtime codec
// preferences untouched. `old-no-red` models an older runtime without RED.
function configure(transceiver, mode) {
  const codecs = audioCodecs();
  const red = codecs.find(codec => codec.mimeType.toLowerCase() === 'audio/red');
  if (!red) throw new Error('audio/red is not available in this browser');

  if (mode === 'new-enabled') {
    transceiver.setCodecPreferences([red, ...codecs.filter(codec => codec !== red)]);
  } else if (mode === 'old-no-red') {
    transceiver.setCodecPreferences(codecs.filter(codec => codec !== red));
  }
}

async function waitForIceGathering(peerConnection) {
  if (peerConnection.iceGatheringState === 'complete') return;
  await timeout(new Promise(resolve => {
    const onStateChange = () => {
      if (peerConnection.iceGatheringState === 'complete') {
        peerConnection.removeEventListener('icegatheringstatechange', onStateChange);
        resolve();
      }
    };
    peerConnection.addEventListener('icegatheringstatechange', onStateChange);
  }), 5000, 'ICE gathering');
}

async function waitForConnected(peerConnection) {
  if (peerConnection.connectionState === 'connected') return;
  await timeout(new Promise((resolve, reject) => {
    const onStateChange = () => {
      if (peerConnection.connectionState === 'connected') {
        peerConnection.removeEventListener('connectionstatechange', onStateChange);
        resolve();
      } else if (peerConnection.connectionState === 'failed' || peerConnection.connectionState === 'closed') {
        reject(new Error(`peer connection ${peerConnection.connectionState}`));
      }
    };
    peerConnection.addEventListener('connectionstatechange', onStateChange);
  }), 10000, 'peer connection');
}

async function waitForFlowingAudio(senderPeer, receiverPeer) {
  return timeout(new Promise(resolve => {
    const poll = async () => {
      const senderStats = await senderPeer.getStats();
      const receiverStats = await receiverPeer.getStats();
      const outbound = [...senderStats.values()].find(report =>
        report.type === 'outbound-rtp'
        && (report.kind === 'audio' || report.mediaType === 'audio')
        && report.packetsSent > 2
      );
      const inbound = [...receiverStats.values()].find(report =>
        report.type === 'inbound-rtp'
        && (report.kind === 'audio' || report.mediaType === 'audio')
        && report.packetsReceived > 2
      );

      if (outbound && inbound) {
        resolve({
          outboundCodec: senderStats.get(outbound.codecId)?.mimeType?.toLowerCase(),
          inboundCodec: receiverStats.get(inbound.codecId)?.mimeType?.toLowerCase(),
          packetsSent: outbound.packetsSent,
          packetsReceived: inbound.packetsReceived,
        });
        return;
      }
      setTimeout(poll, 100);
    };
    poll();
  }), 10000, 'audio flow');
}

function audioCodecOrder(sdp) {
  const lines = sdp.split(/\r?\n/);
  const audioLine = lines.find(line => line.startsWith('m=audio '));
  if (!audioLine) return [];

  const codecByPayload = new Map(lines.flatMap(line => {
    const match = line.match(/^a=rtpmap:(\d+) ([^/]+)/);
    return match ? [[match[1], match[2].toLowerCase()]] : [];
  }));
  return audioLine.split(' ').slice(3).map(payload => codecByPayload.get(payload) ?? payload);
}

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

async function runCase(name, offererMode, answererMode, expectedOuterCodec) {
  const audioContext = new AudioContext();
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const destination = audioContext.createMediaStreamDestination();
  gain.gain.value = 0.01;
  oscillator.connect(gain).connect(destination);
  oscillator.start();
  await audioContext.resume();

  const offerer = new RTCPeerConnection();
  const answerer = new RTCPeerConnection();
  const offererTransceiver = offerer.addTransceiver(destination.stream.getAudioTracks()[0], {
    direction: 'sendonly',
    streams: [destination.stream],
  });
  configure(offererTransceiver, offererMode);

  try {
    await offerer.setLocalDescription(await offerer.createOffer());
    await waitForIceGathering(offerer);
    await answerer.setRemoteDescription(offerer.localDescription);
    configure(answerer.getTransceivers()[0], answererMode);
    await answerer.setLocalDescription(await answerer.createAnswer());
    await waitForIceGathering(answerer);
    await offerer.setRemoteDescription(answerer.localDescription);
    await Promise.all([waitForConnected(offerer), waitForConnected(answerer)]);

    const offerCodecOrder = audioCodecOrder(offerer.localDescription.sdp);
    const answerCodecOrder = audioCodecOrder(answerer.localDescription.sdp);
    const stats = await waitForFlowingAudio(offerer, answerer);

    assert(
      answerCodecOrder[0] === expectedOuterCodec,
      `${name}: expected negotiated ${expectedOuterCodec}, got ${answerCodecOrder.join(', ')}`
    );
    if (expectedOuterCodec === 'opus') {
      assert(!answerCodecOrder.includes('red'), `${name}: RED must be absent from the fallback answer`);
    }
    // WebRTC stats expose the inner Opus codec when RTP uses the RED wrapper.
    assert(stats.outboundCodec === 'audio/opus', `${name}: outbound audio did not use Opus`);
    assert(stats.inboundCodec === 'audio/opus', `${name}: inbound audio did not use Opus`);

    return { name, offererMode, answererMode, offerCodecOrder, answerCodecOrder, ...stats };
  } finally {
    offerer.close();
    answerer.close();
    oscillator.stop();
    await audioContext.close();
  }
}

try {
  const results = [];
  results.push(await runCase('new offers to old RED-capable runtime', 'new-enabled', 'old-default', 'red'));
  results.push(await runCase('old RED-capable runtime offers to new', 'old-default', 'new-enabled', 'red'));
  results.push(await runCase('new offers to old runtime without RED', 'new-enabled', 'old-no-red', 'opus'));
  results.push(await runCase('old runtime without RED offers to new', 'old-no-red', 'new-enabled', 'opus'));
  resultElement.textContent = `PASS\n${JSON.stringify(results, null, 2)}`;
} catch (error) {
  resultElement.textContent = `FAIL\n${error.stack ?? error}`;
}
</script>
